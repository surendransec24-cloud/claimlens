services:
  - type: web
    name: claimlens
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python data/generate_bundles.py"
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: DATABASE_URL
        value: sqlite:///./claimlens.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: GEMINI_API_KEY
        sync: false
